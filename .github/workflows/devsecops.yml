name: SAST Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  SAST_API_URL: ${{ secrets.SAST_API_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write
  pull-requests: write
  packages: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 ─ SAST Scan (Bandit + Semgrep + Custom API)
  # ─────────────────────────────────────────────
  sast-scan:
    name: "🔍 SAST Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] semgrep pip-audit
          pip install requests  # for custom API call

      - name: Install project dependencies (if requirements exist)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # ─── Bandit ───────────────────────────────
      - name: Run Bandit (Python SAST)
        id: bandit
        run: |
          mkdir -p reports/bandit
          bandit -r . \
            --ini .bandit \
            --format json \
            --output reports/bandit/results.json \
            --exclude './.venv,./venv,./node_modules,./sample_targets' \
            --severity-level medium \
            --confidence-level medium \
            || true  # Don't fail here; gate job decides

          # Also generate human-readable output
          bandit -r . \
            --ini .bandit \
            --format txt \
            --output reports/bandit/results.txt \
            --exclude './.venv,./venv,./node_modules,./sample_targets' \
            || true

          echo "Bandit scan complete"
          cat reports/bandit/results.txt || true

      # ─── Semgrep ──────────────────────────────
      - name: Run Semgrep (multi-language SAST)
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          mkdir -p reports/semgrep
          semgrep \
            --config semgrep.yml \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --json \
            --exclude 'sample_targets/**' \
            --exclude 'venv/**' \
            --exclude '.venv/**' \
            . > reports/semgrep/results.json

          python -m json.tool reports/semgrep/results.json > /dev/null

          # Human readable summary
          semgrep \
            --config semgrep.yml \
            --config p/python \
            --config p/security-audit \
            --exclude 'sample_targets/**' \
            . \
            || true

          echo "Semgrep scan complete"

      # ─── Custom SAST API ──────────────────────
      - name: Run Custom SAST API scan
        id: custom_api
        if: env.SAST_API_URL != ''
        run: |
          mkdir -p reports/custom-api
          python - <<'EOF'
          import os, json, requests, pathlib, sys

          api_url  = os.environ.get("SAST_API_URL", "").rstrip("/")
          api_key  = os.environ.get("SAST_API_KEY", "")
          headers  = {"X-API-Key": api_key, "Content-Type": "application/json"}

          findings = []
          failed   = False

          # Collect Python source files
          src_files = list(pathlib.Path(".").rglob("*.py"))
          src_files = [f for f in src_files
                       if not any(p in str(f) for p in ["venv", ".venv", "sample_targets", "__pycache__"])]

          print(f"Submitting {len(src_files)} Python files to SAST API...")

          for path in src_files:
              try:
                  payload = {
                      "filename": str(path),
                      "content":  path.read_text(encoding="utf-8", errors="replace"),
                      "language": "python",
                  }
                  resp = requests.post(f"{api_url}/api/v1/scan/file",
                                       json=payload, headers=headers, timeout=60)
                  resp.raise_for_status()
                  data = resp.json()
                  findings.extend(data.get("findings", []))
              except Exception as exc:
                  print(f"  ERROR scanning {path}: {exc}")
                  failed = True

          out_path = pathlib.Path("reports/custom-api/results.json")
          out_path.write_text(json.dumps({"findings": findings, "total": len(findings)}, indent=2))
          print(f"Custom API found {len(findings)} findings. Results saved to {out_path}")

          critical = [f for f in findings if f.get("severity", "").upper() == "CRITICAL"]
          if critical:
              print(f"CRITICAL findings detected: {len(critical)}")
              failed = True

          sys.exit(1 if failed or critical else 0)
          EOF
        env:
          SAST_API_URL: ${{ secrets.SAST_API_URL }}
          SAST_API_KEY: ${{ secrets.SAST_API_KEY }}

      # ─── Security Gate (SAST level) ───────────
      - name: Security Gate – evaluate findings
        id: evaluate
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          CRITICAL_THRESHOLD = 0   # Zero tolerance for CRITICAL
          HIGH_THRESHOLD     = 5   # Allow up to 5 HIGH findings

          critical_count = 0
          high_count     = 0
          gate_failed    = False

          # ── Bandit ──
          bandit_path = pathlib.Path("reports/bandit/results.json")
          if bandit_path.exists():
              data = json.loads(bandit_path.read_text())
              for r in data.get("results", []):
                  sev = r.get("issue_severity", "").upper()
                  if sev == "HIGH":
                      high_count += 1
                  elif sev == "CRITICAL":
                      critical_count += 1
              print(f"Bandit HIGH={high_count}, CRITICAL={critical_count}")

          # ── Semgrep ──
          semgrep_path = pathlib.Path("reports/semgrep/results.json")
          if semgrep_path.exists():
              data = json.loads(semgrep_path.read_text())
              for r in data.get("results", []):
                  sev = r.get("extra", {}).get("severity", "").upper()
                  if sev in ("ERROR", "CRITICAL"):
                      critical_count += 1
                  elif sev == "WARNING":
                      high_count += 1
              print(f"Semgrep CRITICAL/ERROR={critical_count}, WARNING(HIGH)={high_count}")

          # ── Custom SAST API ──
          custom_api_path = pathlib.Path("reports/custom-api/results.json")
          if custom_api_path.exists():
              data = json.loads(custom_api_path.read_text())
              for finding in data.get("findings", []):
                  severity = finding.get("severity", "").upper()
                  if severity == "CRITICAL":
                      critical_count += 1
                  elif severity == "HIGH":
                      high_count += 1
              print(f"Custom SAST API findings included in gate")

          if critical_count > CRITICAL_THRESHOLD:
              print(f"❌ GATE FAILED: {critical_count} CRITICAL vulnerabilities detected (threshold={CRITICAL_THRESHOLD})")
              gate_failed = True

          if high_count > HIGH_THRESHOLD:
              print(f"❌ GATE FAILED: {high_count} HIGH vulnerabilities detected (threshold={HIGH_THRESHOLD})")
              gate_failed = True

          if not gate_failed:
              print(f"✅ SAST gate passed: CRITICAL={critical_count}, HIGH={high_count}")

          sys.exit(1 if gate_failed else 0)
          EOF

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Comment PR with security summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🔐 SAST Security Scan Results\n\n';

            try {
              const bandit = JSON.parse(fs.readFileSync('reports/bandit/results.json', 'utf8'));
              const total  = (bandit.results || []).length;
              const highs  = (bandit.results || []).filter(r => r.issue_severity === 'HIGH').length;
              summary += `### Bandit\n- Total findings: ${total}\n- HIGH severity: ${highs}\n\n`;
            } catch(e) { summary += '### Bandit\n- No results available\n\n'; }

            try {
              const semgrep = JSON.parse(fs.readFileSync('reports/semgrep/results.json', 'utf8'));
              const total   = (semgrep.results || []).length;
              summary += `### Semgrep\n- Total findings: ${total}\n\n`;
            } catch(e) { summary += '### Semgrep\n- No results available\n\n'; }

            summary += '_Full reports available as workflow artifacts._';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # ─────────────────────────────────────────────
  # JOB 2 ─ Docker Security (Trivy)
  # ─────────────────────────────────────────────
  docker-security:
    name: "🐳 Docker Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        run: |
          if [ -f Dockerfile ]; then
            docker build -t sast-platform:scan .
          elif [ -f docker/Dockerfile ]; then
            docker build -t sast-platform:scan -f docker/Dockerfile .
          else
            echo "No Dockerfile found – skipping image build, scanning base image"
            docker pull python:3.11-slim
            docker tag python:3.11-slim sast-platform:scan
          fi

      - name: Prepare Trivy report directory
        run: mkdir -p reports/trivy

      - name: Run Trivy – vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sast-platform:scan"
          format: "sarif"
          output: "reports/trivy/trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"  # Gate job decides

      - name: Run Trivy – JSON output for gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sast-platform:scan"
          format: "json"
          output: "reports/trivy/trivy-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Trivy Security Gate
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          CRITICAL_THRESHOLD = 0
          HIGH_THRESHOLD     = 10

          path = pathlib.Path("reports/trivy/trivy-results.json")
          if not path.exists():
              print("No trivy results found – skipping gate")
              sys.exit(0)

          data = json.loads(path.read_text())
          critical_count = 0
          high_count     = 0

          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities", []):
                  sev = vuln.get("Severity", "").upper()
                  if sev == "CRITICAL":
                      critical_count += 1
                  elif sev == "HIGH":
                      high_count += 1

          print(f"Trivy – CRITICAL={critical_count}, HIGH={high_count}")
          gate_failed = False

          if critical_count > CRITICAL_THRESHOLD:
              print(f"❌ GATE FAILED: {critical_count} CRITICAL CVEs (threshold={CRITICAL_THRESHOLD})")
              gate_failed = True
          if high_count > HIGH_THRESHOLD:
              print(f"❌ GATE FAILED: {high_count} HIGH CVEs (threshold={HIGH_THRESHOLD})")
              gate_failed = True

          if not gate_failed:
              print(f"✅ Docker security gate passed")

          sys.exit(1 if gate_failed else 0)
          EOF

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "reports/trivy/trivy-results.sarif"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports-${{ github.run_number }}
          path: reports/trivy/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3 ─ Dependency Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: "📦 Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (Python dependencies)
        id: pip_audit
        run: |
          mkdir -p reports/dependency-audit
          if [ -f requirements.txt ]; then
            pip-audit \
              -r requirements.txt \
              --format json \
              --output reports/dependency-audit/pip-audit.json \
              || true
            pip-audit \
              -r requirements.txt \
              || true
          else
            echo "No requirements.txt found – auditing installed packages"
            pip-audit --format json --output reports/dependency-audit/pip-audit.json || true
          fi
          echo "pip-audit complete"

      - name: Set up Node.js (for npm audit)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit (JavaScript dependencies)
        id: npm_audit
        run: |
          mkdir -p reports/dependency-audit
          if [ -f package.json ]; then
            npm audit --json > reports/dependency-audit/npm-audit.json || true
            npm audit || true
          elif [ -f package-lock.json ]; then
            npm audit --json > reports/dependency-audit/npm-audit.json || true
          else
            echo "No package.json found – skipping npm audit"
            echo '{"message": "No package.json found"}' > reports/dependency-audit/npm-audit.json
          fi
          echo "npm audit complete"

      - name: Evaluate dependency vulnerabilities
        run: |
          python - <<'EOF'
          import json, pathlib, sys

          CRITICAL_THRESHOLD = 0
          HIGH_THRESHOLD     = 3

          critical_count = 0
          high_count     = 0

          # ── pip-audit ──
          pip_path = pathlib.Path("reports/dependency-audit/pip-audit.json")
          if pip_path.exists():
              try:
                  data = json.loads(pip_path.read_text())
                  for dep in data.get("dependencies", []):
                      for vuln in dep.get("vulns", []):
                          aliases = vuln.get("aliases", [])
                          # pip-audit doesn't always include severity; count all
                          high_count += 1
                  print(f"pip-audit findings: {high_count}")
              except Exception as e:
                  print(f"Error parsing pip-audit results: {e}")

          # ── npm audit ──
          npm_path = pathlib.Path("reports/dependency-audit/npm-audit.json")
          if npm_path.exists():
              try:
                  data = json.loads(npm_path.read_text())
                  meta = data.get("metadata", {}).get("vulnerabilities", {})
                  npm_critical = meta.get("critical", 0)
                  npm_high     = meta.get("high", 0)
                  critical_count += npm_critical
                  high_count     += npm_high
                  print(f"npm-audit – CRITICAL={npm_critical}, HIGH={npm_high}")
              except Exception as e:
                  print(f"Error parsing npm-audit results: {e}")

          gate_failed = False
          if critical_count > CRITICAL_THRESHOLD:
              print(f"❌ GATE FAILED: {critical_count} CRITICAL dependency vulnerabilities")
              gate_failed = True

          if not gate_failed:
              print(f"✅ Dependency audit gate passed")

          sys.exit(1 if gate_failed else 0)
          EOF

      - name: Upload dependency audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-${{ github.run_number }}
          path: reports/dependency-audit/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4 ─ Security Gate (aggregator)
  # ─────────────────────────────────────────────
  security-gate:
    name: "🚦 Security Gate"
    runs-on: ubuntu-latest
    needs: [sast-scan, docker-security, dependency-audit]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Download all security reports
        uses: actions/download-artifact@v4
        with:
          pattern: "*-reports-*"
          merge-multiple: true
          path: reports/

      - name: Evaluate overall security status
        id: gate
        run: |
          python - <<'EOF'
          import json, pathlib, sys, os

          results = {
              "sast_bandit":     {"status": "UNKNOWN", "findings": []},
              "sast_semgrep":    {"status": "UNKNOWN", "findings": []},
              "docker_trivy":    {"status": "UNKNOWN", "findings": []},
              "dependency_pip":  {"status": "UNKNOWN", "findings": []},
          }

          gate_failed  = False
          total_critical = 0
          total_high     = 0

          # ── Bandit ──
          bandit_path = pathlib.Path("reports/bandit/results.json")
          if bandit_path.exists():
              data  = json.loads(bandit_path.read_text())
              items = data.get("results", [])
              c     = sum(1 for r in items if r.get("issue_severity","").upper() == "CRITICAL")
              h     = sum(1 for r in items if r.get("issue_severity","").upper() == "HIGH")
              total_critical += c
              total_high     += h
              results["sast_bandit"]["status"] = "PASS" if c == 0 else "FAIL"
              print(f"Bandit  → {len(items)} findings (CRITICAL={c}, HIGH={h})")

          # ── Semgrep ──
          semgrep_path = pathlib.Path("reports/semgrep/results.json")
          if semgrep_path.exists():
              data  = json.loads(semgrep_path.read_text())
              items = data.get("results", [])
              c     = sum(1 for r in items if r.get("extra",{}).get("severity","").upper() in ("ERROR","CRITICAL"))
              h     = sum(1 for r in items if r.get("extra",{}).get("severity","").upper() == "WARNING")
              total_critical += c
              total_high     += h
              results["sast_semgrep"]["status"] = "PASS" if c == 0 else "FAIL"
              print(f"Semgrep → {len(items)} findings (CRITICAL={c}, HIGH={h})")

          # ── Trivy ──
          trivy_path = pathlib.Path("reports/trivy/trivy-results.json")
          if trivy_path.exists():
              data = json.loads(trivy_path.read_text())
              c    = sum(1 for r in data.get("Results",[]) for v in r.get("Vulnerabilities",[]) if v.get("Severity","").upper() == "CRITICAL")
              h    = sum(1 for r in data.get("Results",[]) for v in r.get("Vulnerabilities",[]) if v.get("Severity","").upper() == "HIGH")
              total_critical += c
              total_high     += h
              results["docker_trivy"]["status"] = "PASS" if c == 0 else "FAIL"
              print(f"Trivy   → CRITICAL={c}, HIGH={h}")

          # ─── Gate decision ───────────────────
          print("\n" + "="*60)
          print("  SECURITY GATE SUMMARY")
          print("="*60)
          for name, info in results.items():
              icon = "✅" if info["status"] == "PASS" else ("❌" if info["status"] == "FAIL" else "⚠️")
              print(f"  {icon}  {name:<25} {info['status']}")

          print(f"\n  Total CRITICAL : {total_critical}")
          print(f"  Total HIGH     : {total_high}")

          if total_critical > 0:
              print("\n❌ SECURITY GATE FAILED – CRITICAL vulnerabilities must be resolved before merging.")
              gate_failed = True
          else:
              print("\n✅ SECURITY GATE PASSED – No critical vulnerabilities detected.")

          print("="*60)

          # Write summary for GitHub Step Summary
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "w") as f:
              f.write("# 🔐 Security Gate Summary\n\n")
              f.write(f"| Scanner | Status |\n|---------|--------|\n")
              for name, info in results.items():
                  icon = "✅" if info["status"] == "PASS" else ("❌" if info["status"] == "FAIL" else "⚠️")
                  f.write(f"| {name} | {icon} {info['status']} |\n")
              f.write(f"\n**Total CRITICAL**: {total_critical}  \n")
              f.write(f"**Total HIGH**: {total_high}  \n\n")
              if gate_failed:
                  f.write("## ❌ Gate FAILED\nCritical vulnerabilities must be resolved before merging.\n")
              else:
                  f.write("## ✅ Gate PASSED\nNo critical vulnerabilities found.\n")

          sys.exit(1 if gate_failed else 0)
          EOF

      - name: Block merge on gate failure
        if: failure()
        run: |
          echo "::error::Security Gate failed! Merge is blocked until all CRITICAL vulnerabilities are resolved."
          echo "::error::Review the security reports in the workflow artifacts for details."
          exit 1
