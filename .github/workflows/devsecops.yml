name: DevSecOps Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  security:
    name: Required scans and aggregate gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Create report directories
        run: mkdir -p reports/bandit reports/semgrep reports/dependencies reports/trivy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/setup-trivy@v0.2.0
      - name: Install required scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[toml] semgrep pip-audit
      - name: Install dashboard dependencies
        working-directory: services/dashboard
        run: npm ci
      - name: Prepare report and Compose configuration
        run: |
          mkdir -p reports/bandit reports/semgrep reports/dependencies reports/trivy
          cat > .ci.env <<'EOF'
          POSTGRES_DB=sast_db
          POSTGRES_USER=sast_user
          POSTGRES_PASSWORD=ci-placeholder-only
          DATABASE_URL=postgresql+asyncpg://sast_user:ci-placeholder-only@db:5432/sast_db
          DATABASE_SYNC_URL=postgresql+psycopg2://sast_user:ci-placeholder-only@db:5432/sast_db
          REDIS_URL=redis://redis:6379/0
          EOF
          docker compose --env-file .ci.env config --quiet
      - name: Run Bandit
        id: bandit
        continue-on-error: true
        run: |
          set +e
          bandit -r services -f json -o reports/bandit/results.json \
            --exclude 'services/dashboard/node_modules,services/analyzer/sample_targets'
          status=$?
          echo "$status" > reports/bandit/exit-code.txt
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          set +e
          semgrep --config semgrep.yml --config p/python --config p/security-audit \
            --error --json --output reports/semgrep/results.json \
            --exclude 'services/dashboard/node_modules' \
            --exclude 'services/analyzer/sample_targets' .
          json_status=$?
          semgrep --config semgrep.yml --config p/python --config p/security-audit \
            --error --sarif --output reports/semgrep/results.sarif \
            --exclude 'services/dashboard/node_modules' \
            --exclude 'services/analyzer/sample_targets' .
          sarif_status=$?
          printf '%s\n%s\n' "$json_status" "$sarif_status" > reports/semgrep/exit-code.txt
          if [ "$json_status" -gt 1 ] || [ "$sarif_status" -gt 1 ]; then exit 2; fi
      - name: Build actual application images
        id: compose-build
        continue-on-error: true
        run: docker compose --env-file .ci.env build api celery_worker analyzer ai dashboard
      - name: Scan actual application images
        id: trivy
        continue-on-error: true
        run: |
          set +e
          status=0
          for service in api analyzer ai dashboard; do
            image="plataformasast-${service}:local"
            trivy image --severity HIGH,CRITICAL --format json \
              --output "reports/trivy/${service}.json" --exit-code 0 "$image"
            scan_status=$?
            echo "$scan_status" > "reports/trivy/${service}.exit-code.txt"
            if [ "$scan_status" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Audit all Python and dashboard dependency manifests
        id: dependencies
        continue-on-error: true
        run: |
          set +e
          status=0
          for manifest in services/analyzer/requirements.txt services/api/requirements.txt services/ai/requirements.txt requirements-test.txt; do
            name=$(echo "$manifest" | tr '/.' '__')
            report="reports/dependencies/${name}.json"
            pip-audit -r "$manifest" --format json --output "$report"
            audit_status=$?
            echo "$audit_status" > "reports/dependencies/${name}.exit-code.txt"
            if [ "$audit_status" -gt 1 ]; then status=1; fi
          done
          npm audit --json > reports/dependencies/dashboard-npm-audit.json
          npm_status=$?
          echo "$npm_status" > reports/dependencies/dashboard-npm-audit.exit-code.txt
          if [ "$npm_status" -gt 1 ]; then status=1; fi
          exit "$status"
      - name: Evaluate reports and enforce aggregate limits
        id: gate
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          reports = pathlib.Path("reports")
          errors = []
          critical = high = 0

          def read_json(path, validator):
              if not path.is_file():
                  errors.append(f"Required report missing: {path}")
                  return None
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"Invalid report {path}: {exc}")
                  return None
              if not validator(data):
                  errors.append(f"Unexpected report schema: {path}")
                  return None
              return data

          def check_status(path):
              try:
                  code = int(path.read_text(encoding="utf-8").strip())
              except (OSError, ValueError):
                  errors.append(f"Scanner status missing/invalid: {path}")
                  return
              if code not in (0, 1):
                  errors.append(f"Scanner failed with exit code {code}: {path}")

          bandit = read_json(reports / "bandit/results.json", lambda d: isinstance(d, dict) and isinstance(d.get("results"), list))
          check_status(reports / "bandit/exit-code.txt")
          if bandit:
              for finding in bandit["results"]:
                  severity = finding.get("issue_severity", "").upper()
                  critical += severity == "CRITICAL"
                  high += severity == "HIGH"

          semgrep = read_json(reports / "semgrep/results.json", lambda d: isinstance(d, dict) and isinstance(d.get("results"), list))
          read_json(
              reports / "semgrep/results.sarif",
              lambda d: isinstance(d, dict) and isinstance(d.get("runs"), list),
          )
          status_path = reports / "semgrep/exit-code.txt"
          try:
              statuses = [int(value) for value in status_path.read_text(encoding="utf-8").splitlines()]
          except (OSError, ValueError):
              errors.append(f"Scanner status missing/invalid: {status_path}")
              statuses = []
          if len(statuses) != 2 or any(code not in (0, 1) for code in statuses):
              errors.append(f"Semgrep scan failed or status incomplete: {status_path}")
          if semgrep:
              for finding in semgrep["results"]:
                  severity = finding.get("extra", {}).get("severity", "").upper()
                  critical += severity in ("CRITICAL", "ERROR")
                  high += severity == "WARNING"

          for service in ("api", "analyzer", "ai", "dashboard"):
              path = reports / "trivy" / f"{service}.json"
              data = read_json(path, lambda d: isinstance(d, dict) and isinstance(d.get("Results"), list))
              check_status(path.with_name(f"{service}.exit-code.txt"))
              if data:
                  for result in data["Results"]:
                      for finding in result.get("Vulnerabilities") or []:
                          severity = finding.get("Severity", "").upper()
                          critical += severity == "CRITICAL"
                          high += severity == "HIGH"

          required_python = [
              "services__analyzer__requirements_txt",
              "services__api__requirements_txt",
              "services__ai__requirements_txt",
              "requirements_test_txt",
          ]
          for name in required_python:
              path = reports / "dependencies" / f"{name}.json"
              data = read_json(path, lambda d: isinstance(d, dict) and isinstance(d.get("dependencies"), list))
              check_status(path.with_suffix(".exit-code.txt"))
              if data:
                  # pip-audit does not expose a consistent severity for every advisory;
                  # count every advisory as HIGH so unknown severity cannot pass silently.
                  high += sum(len(dependency.get("vulns", [])) for dependency in data["dependencies"])

          npm_path = reports / "dependencies/dashboard-npm-audit.json"
          npm = read_json(npm_path, lambda d: isinstance(d, dict) and isinstance(d.get("metadata", {}).get("vulnerabilities"), dict))
          check_status(reports / "dependencies/dashboard-npm-audit.exit-code.txt")
          if npm:
              counts = npm["metadata"]["vulnerabilities"]
              critical += int(counts.get("critical", 0))
              high += int(counts.get("high", 0))

          high_limit, critical_limit = 10, 0
          if critical > critical_limit:
              errors.append(f"CRITICAL count {critical} exceeds limit {critical_limit}")
          if high > high_limit:
              errors.append(f"HIGH count {high} exceeds limit {high_limit}")

          summary = {"critical": critical, "high": high, "critical_limit": critical_limit, "high_limit": high_limit, "errors": errors}
          (reports / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as output:
              output.write("# DevSecOps security gate\n\n")
              output.write(f"- CRITICAL: {critical} (limit {critical_limit})\n- HIGH: {high} (limit {high_limit})\n")
              if errors:
                  output.write("\n## Failures\n" + "\n".join(f"- {error}" for error in errors) + "\n")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Security gate passed: CRITICAL={critical}, HIGH={high}")
          PY
      - name: Publish Semgrep SARIF
        if: always() && hashFiles('reports/semgrep/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep/results.sarif
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-security-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Comment on pull request with gate results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## DevSecOps security gate\n\n';
            try {
              const result = JSON.parse(fs.readFileSync('reports/summary.json', 'utf8'));
              body += `- CRITICAL: ${result.critical} / ${result.critical_limit}\n`;
              body += `- HIGH: ${result.high} / ${result.high_limit}\n`;
              body += result.errors.length
                ? `\nGate failed:\n${result.errors.map(error => `- ${error}`).join('\n')}\n`
                : '\nGate passed.\n';
            } catch (error) {
              body += `Gate report unavailable or invalid: ${error.message}\n`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
