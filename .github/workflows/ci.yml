name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: services/dashboard
        run: npm ci
      - name: Lint dashboard
        working-directory: services/dashboard
        run: npm run lint
      - name: Build dashboard
        working-directory: services/dashboard
        run: npm run build

  unit-tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            services/analyzer/requirements.txt
            services/api/requirements.txt
            services/ai/requirements.txt
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/analyzer/requirements.txt
          python -m pip install -r services/api/requirements.txt
          python -m pip install -r services/ai/requirements.txt
          python -m pip install -r requirements-test.txt
      - name: Run tests with the configured coverage gate
        run: |
          mkdir -p reports/junit reports/coverage
          python -m pytest tests/ -v --tb=short \
            --cov=services \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/html \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=reports/junit/test-results.xml
      - name: Upload test and coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  compose-build:
    name: Build Compose service images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure non-secret CI environment
        run: |
          cat > .ci.env <<'EOF'
          POSTGRES_DB=sast_db
          POSTGRES_USER=sast_user
          POSTGRES_PASSWORD=ci-placeholder-only
          DATABASE_URL=postgresql+asyncpg://sast_user:ci-placeholder-only@db:5432/sast_db
          DATABASE_SYNC_URL=postgresql+psycopg2://sast_user:ci-placeholder-only@db:5432/sast_db
          REDIS_URL=redis://redis:6379/0
          EOF
      - name: Validate and build the actual Compose images
        run: |
          docker compose --env-file .ci.env config --quiet
          docker compose --env-file .ci.env build
