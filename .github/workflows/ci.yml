name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 ─ Lint
  # ─────────────────────────────────────────────
  lint:
    name: "🔎 Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Python Lint ──────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python linters
        run: |
          pip install flake8 flake8-bugbear flake8-comprehensions black isort mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run flake8
        run: |
          flake8 . \
            --count \
            --max-line-length 120 \
            --extend-ignore E203,W503 \
            --extend-immutable-calls=Depends,Query \
            --exclude venv,.venv,__pycache__,migrations,sample_targets \
            --statistics \
            --format '%(path)s:%(row)d:%(col)d: %(code)s %(text)s'

      - name: Run black (format check)
        run: |
          black --check --diff \
            --line-length 120 \
            --exclude '/(\.venv|venv|sample_targets|migrations)/' \
            .

      - name: Run isort (import order check)
        run: |
          isort --check-only --diff \
            --profile black \
            --skip venv --skip .venv --skip sample_targets \
            .

      - name: Run mypy (type checking)
        run: |
          if [ -f mypy.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            mypy . \
              --ignore-missing-imports \
              --exclude 'venv|\.venv|sample_targets|migrations' \
              || true  # Non-blocking for now
          else
            echo "No mypy config found – skipping type check"
          fi

      # ─── JavaScript/Node Lint ─────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
        if: hashFiles('package.json') != ''

      - name: Install Node.js dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Run ESLint
        if: hashFiles('package.json') != '' && hashFiles('.eslintrc*') != ''
        run: |
          npx eslint . \
            --ext .js,.jsx,.ts,.tsx \
            --ignore-path .gitignore \
            --max-warnings 0 \
            || true  # Non-blocking; adjust as needed

      - name: Run Prettier (format check)
        if: hashFiles('package.json') != '' && hashFiles('.prettierrc*') != ''
        run: |
          npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}" \
            --ignore-path .gitignore \
            || true

  # ─────────────────────────────────────────────
  # JOB 2 ─ Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio pytest-mock httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:reports/coverage/coverage.xml \
            --cov-report=html:reports/coverage/html \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=reports/junit/test-results-${{ matrix.python-version }}.xml \
            -v \
            --tb=short \
            || true  # Collect results regardless

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}-${{ github.run_number }}
          path: |
            reports/junit/
            reports/coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: reports/coverage/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3 ─ Build Docker Images
  # ─────────────────────────────────────────────
  build-docker:
    name: "🐳 Build Docker Images"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=SAST Platform
            org.opencontainers.image.description=Static Application Security Testing Platform
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}

      - name: Build dev/test image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sast-platform:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 4 ─ Push to Registry (main branch only)
  # ─────────────────────────────────────────────
  push-registry:
    name: "📤 Push to Registry"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify image pushed
        run: |
          echo "Image successfully built and pushed in build-docker job."
          echo "Digest: ${{ needs.build-docker.outputs.image-digest }}"
          echo "Tags:   ${{ needs.build-docker.outputs.image-tag }}"

      - name: Notify deployment readiness
        run: |
          echo "::notice::Docker image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "::notice::Digest: ${{ needs.build-docker.outputs.image-digest }}"

  # ─────────────────────────────────────────────
  # JOB 5 ─ CI Summary
  # ─────────────────────────────────────────────
  ci-summary:
    name: "📋 CI Summary"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build-docker]
    if: always()

    steps:
      - name: Generate CI summary
        run: |
          echo "## 🏗️ CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
