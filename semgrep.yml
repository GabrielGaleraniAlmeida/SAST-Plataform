# =============================================================================
# semgrep.yml — Custom Semgrep Rules for SAST Platform
# =============================================================================
# Run with: semgrep --config semgrep.yml <path>
# Docs: https://semgrep.dev/docs/writing-rules/overview/
# =============================================================================

rules:

  # ---------------------------------------------------------------------------
  # RULE 1 – SQL Injection via string formatting
  # ---------------------------------------------------------------------------
  - id: sql-injection-string-format
    patterns:
      - pattern: |
          $QUERY = "..." % $INPUT
      - pattern-not: |
          $QUERY = "SELECT 1"
    message: >
      Potential SQL injection: string formatting used to construct a SQL query.
      Use parameterized queries or an ORM instead.
      Found in $QUERY.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      references:
        - https://owasp.org/www-community/attacks/SQL_Injection

  - id: sql-injection-fstring
    patterns:
      - pattern: |
          $CONN.execute(f"...{$VAR}...")
    message: >
      Potential SQL injection: f-string interpolation inside a SQL execute call.
      Use parameterized queries: conn.execute("SELECT ... WHERE id = ?", (id,))
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: sql-injection-format-method
    patterns:
      - pattern: |
          $CONN.execute("...".format(...))
      - pattern: |
          $CURSOR.execute("...".format(...))
    message: >
      SQL injection risk: .format() used to build SQL query string.
      Replace with parameterized queries.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: sql-injection-concatenation
    patterns:
      - pattern: |
          $CURSOR.execute($QUERY + $INPUT)
      - pattern: |
          $CONN.execute($QUERY + $INPUT)
    message: >
      SQL injection via string concatenation. Always use parameterized queries.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 2 – Hardcoded Credentials
  # ---------------------------------------------------------------------------
  - id: hardcoded-password-assignment
    patterns:
      - pattern: $PASSWORD = "..."
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i)(password|passwd|pwd|secret|api_?key|auth_?token|access_?token|client_?secret)
      - pattern-not: $PASSWORD = ""
      - pattern-not: $PASSWORD = "changeme"
      - pattern-not: $PASSWORD = "your-secret-here"
    message: >
      Hardcoded credential detected in variable '$PASSWORD'.
      Store secrets in environment variables or a secrets manager (e.g., AWS Secrets Manager, HashiCorp Vault).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM

  - id: hardcoded-api-key-string
    patterns:
      - pattern: |
          $VAR = "$KEY"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|xox[baprs]-[0-9a-zA-Z]{10,})
    message: >
      Hardcoded API key/token detected (pattern matches AWS key, GitHub PAT, Slack token, or OpenAI key).
      Use environment variables instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH

  - id: hardcoded-db-password-in-url
    pattern: |
      $VAR = "postgresql://$USER:$PASS@..."
    message: >
      Database password embedded directly in a connection string.
      Use environment variables or connection string builders that read from secrets.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-798"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 3 – Use of eval()
  # ---------------------------------------------------------------------------
  - id: dangerous-eval-call
    patterns:
      - pattern: eval($CODE)
      - pattern-not: eval("...")  # Allow simple constant strings
    message: >
      Use of eval() with a dynamic argument is dangerous and can lead to arbitrary code execution.
      Refactor to avoid eval(), or use ast.literal_eval() for safe expression evaluation.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: dangerous-exec-call
    patterns:
      - pattern: exec($CODE)
      - pattern-not: exec("...")
    message: >
      Use of exec() with a dynamic argument poses arbitrary code execution risk.
      Avoid exec() with user-controlled data entirely.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-95"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 4 – Insecure Deserialization (pickle)
  # ---------------------------------------------------------------------------
  - id: insecure-pickle-loads
    patterns:
      - pattern: pickle.loads($DATA)
      - pattern: pickle.load($FILE)
      - pattern: cPickle.loads($DATA)
      - pattern: cPickle.load($FILE)
    message: >
      Insecure deserialization: pickle.loads/load() can execute arbitrary code when
      deserializing untrusted data. Use JSON or another safe serialization format.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      references:
        - https://docs.python.org/3/library/pickle.html#restricting-globals

  - id: insecure-yaml-load
    patterns:
      - pattern: yaml.load($DATA)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($DATA, Loader=yaml.BaseLoader)
    message: >
      yaml.load() without a safe Loader can execute arbitrary Python objects.
      Use yaml.safe_load() or yaml.load(data, Loader=yaml.SafeLoader) instead.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-502"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 5 – Insecure Subprocess / Command Injection
  # ---------------------------------------------------------------------------
  - id: command-injection-os-system
    patterns:
      - pattern: os.system($CMD)
      - pattern-not: os.system("...")
    message: >
      os.system() called with a dynamic argument — potential command injection.
      Use subprocess.run() with a list argument and shell=False instead.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: command-injection-subprocess-shell-true
    patterns:
      - pattern: subprocess.run($CMD, ..., shell=True, ...)
      - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
    message: >
      subprocess called with shell=True and a dynamic command — command injection risk.
      Prefer shell=False and pass arguments as a list: subprocess.run(["cmd", arg1, arg2]).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78"
      owasp: "A03:2021 - Injection"
      confidence: HIGH

  - id: command-injection-os-popen
    patterns:
      - pattern: os.popen($CMD)
      - pattern-not: os.popen("...")
    message: >
      os.popen() with a dynamic argument is vulnerable to command injection.
      Use subprocess.run() with shell=False.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 6 – Weak Cryptography
  # ---------------------------------------------------------------------------
  - id: weak-hash-md5
    patterns:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.new("md5", ...)
    message: >
      MD5 is cryptographically broken. Do not use MD5 for security-sensitive hashing
      (passwords, integrity checks). Use SHA-256 or better. For passwords, use
      bcrypt, argon2, or scrypt via passlib.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH

  - id: weak-hash-sha1
    patterns:
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("sha1", ...)
    message: >
      SHA-1 is considered weak for security purposes. Use SHA-256 or SHA-3.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-327"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # RULE 7 – Debug Mode in Production
  # ---------------------------------------------------------------------------
  - id: flask-debug-true
    patterns:
      - pattern: app.run(..., debug=True, ...)
      - pattern: app.run(debug=True)
    message: >
      Flask debug mode is enabled. This exposes the interactive debugger and must
      never be used in production. Use DEBUG=False or read from environment.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-215: Insertion of Sensitive Information Into Debugging Code"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: HIGH

  - id: django-debug-true
    pattern: |
      DEBUG = True
    message: >
      Django DEBUG=True found. Ensure this is not set in production settings.
      Use environment-based configuration: DEBUG = os.getenv("DJANGO_DEBUG", "False") == "True"
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-215"
      owasp: "A05:2021 - Security Misconfiguration"
      confidence: MEDIUM

  # ---------------------------------------------------------------------------
  # RULE 8 – Path Traversal
  # ---------------------------------------------------------------------------
  - id: path-traversal-open
    patterns:
      - pattern: open($PATH, ...)
      - pattern-not: open("...", ...)
    message: >
      open() called with a dynamic path — potential path traversal vulnerability.
      Validate and sanitize the path; use pathlib.Path.resolve() and verify
      the result is within an expected base directory.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW

  - id: path-traversal-send-file
    patterns:
      - pattern: flask.send_file($PATH)
      - pattern: send_file($PATH)
    message: >
      flask.send_file() with a dynamic path can expose arbitrary files.
      Validate the path against an allowlist or use flask.send_from_directory().
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-22"
      owasp: "A01:2021 - Broken Access Control"
      confidence: HIGH

  # ---------------------------------------------------------------------------
  # RULE 9 – SSRF (Server-Side Request Forgery)
  # ---------------------------------------------------------------------------
  - id: ssrf-requests-get-user-input
    patterns:
      - pattern: requests.get($URL, ...)
      - pattern-not: requests.get("...", ...)
    message: >
      requests.get() with a dynamic URL can lead to SSRF.
      Validate URLs against an allowlist; block internal/private IP ranges.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: LOW

  - id: ssrf-urllib-user-input
    patterns:
      - pattern: urllib.request.urlopen($URL)
      - pattern-not: urllib.request.urlopen("...")
    message: >
      urllib.request.urlopen() with a dynamic URL may be exploitable for SSRF.
      Validate and restrict URLs before making outbound requests.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-918"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: LOW

  # ---------------------------------------------------------------------------
  # RULE 10 – Insecure Random
  # ---------------------------------------------------------------------------
  - id: insecure-random-for-crypto
    patterns:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
    message: >
      The random module is not cryptographically secure.
      For security-sensitive operations (tokens, OTPs, keys), use secrets module instead:
      secrets.token_hex(), secrets.token_urlsafe(), secrets.choice().
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: LOW
